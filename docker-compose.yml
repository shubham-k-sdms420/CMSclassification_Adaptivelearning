services:
  cms-roberta-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cms-complaint-classifier
    ports:
      - "5015:5015"
    volumes:
      # Mount model directory so model files persist and can be updated
      - ./CMS_RoBerta/model:/app/CMS_RoBerta/model
    environment:
      - MODEL_DIR=/app/CMS_RoBerta/model
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5015/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
